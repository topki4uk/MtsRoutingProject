spring.application.name=MtsRoutingProject
spring.application.database-count=3

spring.datasource.primary.url=jdbc:postgresql://localhost:5432/db_primary
spring.datasource.secondary.url=jdbc:postgresql://localhost:5433/db_secondary
spring.datasource.tertiary.url=jdbc:postgresql://localhost:5434/db_tertiary

spring.datasource.primary.username=postgres
spring.datasource.primary.password=postgres
spring.datasource.secondary.username=postgres
spring.datasource.secondary.password=postgres
spring.datasource.tertiary.username=postgres
spring.datasource.tertiary.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
