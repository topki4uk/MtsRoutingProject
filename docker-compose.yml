services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env

  postgres-primary:
    image: postgres:16
    container_name: mipt_postgres_primary
    environment:
      POSTGRES_DB: db_primary
      POSTGRES_USER: ${SPRING_DATASOURCE_PRIMARY_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PRIMARY_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-secondary:
    image: postgres:16
    container_name: mipt_postgres_secondary
    environment:
      POSTGRES_DB: db_secondary
      POSTGRES_USER: ${SPRING_DATASOURCE_SECONDARY_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_SECONDARY_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_secondary_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-tertiary:
    image: postgres:16
    container_name: mipt_postgres_tertiary
    environment:
      POSTGRES_DB: db_tertiary
      POSTGRES_USER: ${SPRING_DATASOURCE_TERTIARY_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_TERTIARY_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_tertiary_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_primary_data:
  postgres_secondary_data:
  postgres_tertiary_data: